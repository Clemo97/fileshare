<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Acornet app icon: an acorn whose cap is a small network. Source for assets/images/icon.png
       (rendered to a 1024 px PNG without transparency) and favicon.png. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1AA79A"/>
      <stop offset="1" stop-color="#0A5753"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFCB5C"/>
      <stop offset="1" stop-color="#EE8420"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A4E26"/>
      <stop offset="1" stop-color="#5C3217"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#032B29" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <g filter="url(#shadow)">
    <path d="M512 270 C512 222 522 188 552 152" fill="none" stroke="#5C3217" stroke-width="44" stroke-linecap="round"/>
    <path d="M298 505 C298 690 400 810 512 880 C624 810 726 690 726 505 Z" fill="url(#nut)" stroke="#EE8420" stroke-width="10" stroke-linejoin="round"/>
    <path d="M346 575 C356 680 410 752 452 796" fill="none" stroke="#FFF1CF" stroke-opacity="0.45" stroke-width="22" stroke-linecap="round"/>
    <path d="M266 520 C266 340 380 258 512 258 C644 258 758 340 758 520 Z" fill="url(#cap)"/>
    <rect x="248" y="476" width="528" height="86" rx="43" fill="#6E3C1B"/>
    <g stroke="#FFE9C7" stroke-width="9" stroke-linecap="round" opacity="0.9">
      <line x1="512" y1="336" x2="388" y2="420"/>
      <line x1="512" y1="336" x2="636" y2="420"/>
      <line x1="512" y1="336" x2="512" y2="440"/>
      <line x1="388" y1="420" x2="512" y2="440"/>
      <line x1="636" y1="420" x2="512" y2="440"/>
    </g>
    <g fill="#FFE9C7">
      <circle cx="512" cy="336" r="19"/>
      <circle cx="388" cy="420" r="19"/>
      <circle cx="636" cy="420" r="19"/>
    </g>
    <circle cx="512" cy="440" r="24" fill="#FFCB5C"/>
  </g>
</svg>
