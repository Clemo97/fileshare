# Pushing a tag like v1.1.0 builds the iOS app on Expo's servers and uploads it to TestFlight.
# It does NOT submit the build for App Review: that stays a manual step in App Store Connect.
#
# Needs one repository secret, EXPO_TOKEN (an Expo access token), and the one-time setup in
# RELEASE_PLAN.md (Apple Developer account, the app created in App Store Connect, the App Store
# Connect API key stored in EAS by running `eas submit -p ios` once by hand, and the production
# environment variables in EAS). The repository is public: nothing secret may be written here.
name: Release iOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  testflight:
    name: Build and send to TestFlight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      # actions/checkout v7.0.1, actions/setup-node v7.1.0, expo/expo-github-action 9.0.1 (pinned by commit)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint

      # A tag must say which version it ships, or the store would get a build that disagrees with it.
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./app.json').expo.version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match expo.version ${version} in app.json"
            exit 1
          fi

      - uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # --no-wait: the build and the TestFlight upload carry on on Expo's servers; follow them
      # at the link this prints.
      - name: Build and submit to TestFlight
        run: eas build --platform ios --profile production --auto-submit --non-interactive --no-wait
